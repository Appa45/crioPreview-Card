<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="card">
    <div class="card__images">
      <img class="card__main-image" src="./assets/image-equilibrium.jpg" alt="Equilibrium NFT">
      <div class="card__images-layer">
        <img src="./assets/icon-view.svg" alt="View NFT">
      </div>
    </div>

    <div class="card__title">
      <h1>Equilibrium #3429</h1>
      <p>Our Equilibrium collection promotes balance and calm.</p>
    </div>

    <div class="card__time">
      <div class="card__time-left">
        <img src="./assets/icon-ethereum.svg" alt="Ethereum">
        <span>0.041 ETH</span>
      </div>
      <div class="card__time-right">
        <img src="./assets/icon-clock.svg" alt="Time left">
        <span>3 days left.</span>
      </div>
    </div>

    <div class="card__creator">
      <img class="creator-image" src="./assets/image-avatar.png" alt="Creator">
      <p>Creation of <span>Jules Wyvern</span></p>
    </div>
  </main>

  <footer class="attribution">
    <span>Challenge by </span>
    <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">Crio</a>
    <span>. Coded by </span>
    <a href="https://github.com/yourusername" target="_blank" rel="noopener noreferrer">Developer</a>
  </footer>
</body>
</html>
